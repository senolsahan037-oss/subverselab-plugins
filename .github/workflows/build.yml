name: Build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    name: windows-vst3 (${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Kubbe
            dir: subverselab-reverb
            artifact: KUBBE-windows-vst3
            vst3_name: "SubverseLab Kubbe.vst3"
          - name: Kaset
            dir: subverselab-kaset
            artifact: KASET-windows-vst3
            vst3_name: "SubverseLab Kaset.vst3"
          # KORO / YANKI / HAVA / TUTKAL: 1.0.0, licensing OFF (account-bound download). Their test tools differ from
          # KUBBE/KASET: `tools` is the extra build targets, `check` the test command (run from the project dir),
          # `panel_dir` makes the snapshot step write a folder of PNGs (ui_snapshot <dir>) instead of one file.
          # `soft_test`: the test needs the prototype audio (../prototypes/...), which only exists on the owner's Mac,
          # so a failure here must not block the zip; the numbers that count come from the Mac run.
          - name: Koro
            dir: subverselab-koro
            artifact: KORO-windows-vst3
            vst3_name: "KORO.vst3"
            tools: "render ui_snapshot"
            check: "./build/render_artefacts/Release/render.exe --selftest"
            panel_dir: "yes"
            soft_test: true
          - name: Yanki
            dir: subverselab-yanki
            artifact: YANKI-windows-vst3
            vst3_name: "YANKI.vst3"
            tools: "render ui_snapshot"
            check: "./build/render_artefacts/Release/render.exe --selftest"
            panel_dir: "yes"
            soft_test: true
          - name: Hava
            dir: subverselab-hava
            artifact: HAVA-windows-vst3
            vst3_name: "HAVA.vst3"
            tools: "plugin_check ui_snapshot"
            check: "./build/plugin_check_artefacts/Release/plugin_check.exe"
            panel_dir: "yes"
            soft_test: true   # plugin_check exited 127 on the runner (start-up, not a test failure: the exe was built); the Mac run is the gate
          - name: Tutkal
            dir: subverselab-tutkal
            artifact: TUTKAL-windows-vst3
            vst3_name: "TUTKAL.vst3"
            tools: "plugin_check ui_snapshot"
            check: "./build/plugin_check_artefacts/Release/plugin_check.exe"
            panel_dir: "yes"
            soft_test: true
          # MIHENK 1.0.1: VST3 + standalone app (no AU on Windows). The zip carries MIHENK.vst3 and MIHENK.exe.
          # render --selftest needs no audio files (tests/corpus is not synced). ui_snapshot takes <out.png> <variant>.
          - name: Mihenk
            dir: subverselab-mihenk
            artifact: MIHENK-windows
            vst3_name: "MIHENK.vst3"
            tools: "Mihenk_Standalone render ui_snapshot"
            check: "./build/render_artefacts/Release/render.exe --selftest"
            standalone_exe: "MIHENK.exe"
            snapshot_variants: "v10-simple v10-advanced plugin"
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE FetchContent
        uses: actions/cache@v4
        with:
          path: ${{ matrix.dir }}/build/_deps
          key: ${{ runner.os }}-juce-9.0.1-${{ matrix.dir }}

      - name: Configure (Release, x64)
        working-directory: ${{ matrix.dir }}
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3 + render + ui_snapshot
        working-directory: ${{ matrix.dir }}
        run: cmake --build build --config Release --target ${{ matrix.name }}_VST3 ${{ matrix.tools || 'render ui_snapshot' }} --parallel

      - name: Run render --selftest
        continue-on-error: ${{ matrix.soft_test == true }}
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: ${{ matrix.check || './build/render_artefacts/Release/render.exe --selftest' }}

      - name: Zip VST3 bundle
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: |
          cd "build/${{ matrix.name }}_artefacts/Release/VST3"
          7z a -r "${{ github.workspace }}/${{ matrix.artifact }}.zip" "${{ matrix.vst3_name }}"
          if [ -n "${{ matrix.standalone_exe }}" ]; then
            cd ../Standalone
            7z a "${{ github.workspace }}/${{ matrix.artifact }}.zip" "${{ matrix.standalone_exe }}"
          fi

      # The panel as Windows draws it, so the lettering can be checked without a Windows machine.
      - name: Panel snapshots (variants)
        if: matrix.snapshot_variants != ''
        continue-on-error: true
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/${{ matrix.name }}-windows-panel"
          for v in ${{ matrix.snapshot_variants }}; do
            ./build/ui_snapshot_artefacts/Release/ui_snapshot.exe "$GITHUB_WORKSPACE/${{ matrix.name }}-windows-panel/$v.png" "$v" 1.0
          done

      - uses: actions/upload-artifact@v4
        if: matrix.snapshot_variants != ''
        continue-on-error: true
        with:
          name: ${{ matrix.name }}-windows-panel
          path: ${{ matrix.name }}-windows-panel/

      - name: Panel snapshot
        if: matrix.panel_dir != 'yes' && matrix.snapshot_variants == ''
        continue-on-error: true
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: ./build/ui_snapshot_artefacts/Release/ui_snapshot.exe "${{ github.workspace }}/${{ matrix.name }}-windows-panel.png"

      - uses: actions/upload-artifact@v4
        if: matrix.panel_dir != 'yes' && matrix.snapshot_variants == ''
        continue-on-error: true
        with:
          name: ${{ matrix.name }}-windows-panel
          path: ${{ matrix.name }}-windows-panel.png

      # KORO / YANKI / HAVA / TUTKAL: ui_snapshot takes an output folder and writes every face (front, rear, ...).
      - name: Panel snapshots (folder)
        if: matrix.panel_dir == 'yes'
        continue-on-error: true
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/${{ matrix.name }}-windows-panel"
          ./build/ui_snapshot_artefacts/Release/ui_snapshot.exe "${{ github.workspace }}/${{ matrix.name }}-windows-panel"

      - uses: actions/upload-artifact@v4
        if: matrix.panel_dir == 'yes'
        continue-on-error: true
        with:
          name: ${{ matrix.name }}-windows-panel
          path: ${{ matrix.name }}-windows-panel/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  macos-cross-check:
    name: macos-arm64 (${{ matrix.name }})
    runs-on: macos-14
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Kubbe
            dir: subverselab-reverb
          - name: Kaset
            dir: subverselab-kaset
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE FetchContent
        uses: actions/cache@v4
        with:
          path: ${{ matrix.dir }}/build/_deps
          key: ${{ runner.os }}-juce-9.0.1-${{ matrix.dir }}

      - name: Configure (Release, arm64)
        working-directory: ${{ matrix.dir }}
        run: cmake -B build -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_BUILD_TYPE=Release

      - name: Build render + ui_snapshot + VST3
        working-directory: ${{ matrix.dir }}
        run: cmake --build build --config Release --target ${{ matrix.name }}_VST3 render ui_snapshot --parallel

      - name: Run render --selftest
        working-directory: ${{ matrix.dir }}
        run: ./build/render_artefacts/Release/render --selftest

  # ELEK (subverselab-splitter-desktop): VST3 + standalone app, ONNX Runtime 1.18 next to the binaries, the 302 MB model
  # htdemucs.onnx downloaded from the ELEK_MODEL_URL repository variable (it is over GitHub's file limit, so it is not synced).
  elek-windows:
    name: windows (Elek)
    runs-on: windows-latest
    if: ${{ vars.ELEK_MODEL_URL != '' }}
    defaults:
      run:
        working-directory: subverselab-splitter-desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE FetchContent
        uses: actions/cache@v4
        with:
          path: subverselab-splitter-desktop/build/_deps
          key: ${{ runner.os }}-juce-elek

      - name: ONNX Runtime 1.18.0 (win x64) and the model
        run: |
          mkdir -p _deps/onnxruntime Resources
          curl -fL -o ort.zip "https://github.com/microsoft/onnxruntime/releases/download/v1.18.0/onnxruntime-win-x64-1.18.0.zip"
          7z x -y ort.zip -o_deps > /dev/null
          cp -r _deps/onnxruntime-win-x64-1.18.0/* _deps/onnxruntime/
          curl -fL -o Resources/htdemucs.onnx "${{ vars.ELEK_MODEL_URL }}"
          ls -la Resources/htdemucs.onnx _deps/onnxruntime/lib

      - name: Configure (Release, x64)
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DSVL_LICENSING=OFF

      - name: Build VST3 + standalone + ui_snapshot
        run: cmake --build build --config Release --target SubverseSplitter_VST3 SubverseSplitter_Standalone test_ui_snapshot elek_host_test --parallel

      - name: Bundle contents (DLL and model must sit next to the plug-in binary)
        run: ls -la build/SubverseSplitter_artefacts/Release/VST3/ELEK.vst3/Contents/x86_64-win build/SubverseSplitter_artefacts/Release/Standalone

      # Loads ELEK.vst3 as a DAW does and runs one separation (SPLITTER_AUTOTEST). A VST3 that imports onnxruntime.dll directly does
      # not load in a DAW on Windows; this is the gate for the delay-loaded path. The release is not published unless it passes.
      - name: Host test (load the VST3, separate 20 s, check the stems)
        run: |
          ./build/elek_host_test_artefacts/Release/elek_host_test.exe "$(pwd)/build/SubverseSplitter_artefacts/Release/VST3/ELEK.vst3" 1500 || { echo "---- ELEK.log"; cat "$APPDATA/SubverseLab/ELEK.log" 2>/dev/null || find "$USERPROFILE" -name ELEK.log -path '*SubverseLab*' -exec cat {} \; 2>/dev/null; exit 1; }

      - name: Panel snapshot (empty state)
        continue-on-error: true
        run: ./build/test_ui_snapshot_artefacts/Release/test_ui_snapshot.exe --empty "$GITHUB_WORKSPACE/Elek-windows-panel.png"

      - name: Zip VST3 + app
        run: |
          cd build/SubverseSplitter_artefacts/Release
          7z a -r "$GITHUB_WORKSPACE/ELEK-windows.zip" VST3/ELEK.vst3 Standalone/ELEK.exe Standalone/onnxruntime.dll Standalone/htdemucs.onnx

      - uses: actions/upload-artifact@v4
        with:
          name: ELEK-windows
          path: ELEK-windows.zip

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Elek-windows-panel
          path: Elek-windows-panel.png
